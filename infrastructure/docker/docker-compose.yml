# Postgres local para desarrollo. Redis queda en un perfil opcional:
# no hace falta para arrancar el esqueleto y BullMQ no está instalado.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: comprausa
      POSTGRES_PASSWORD: comprausa
      POSTGRES_DB: comprausa
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U comprausa -d comprausa"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    profiles: ["optional"]
    ports:
      - "6379:6379"

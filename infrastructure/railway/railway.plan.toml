# Histórico. La configuración activa está en .railway/railway.ts.
# Este archivo NO se llama railway.toml a propósito: Railway no debe autodetectarlo.
#
# Staging previsto:
#   service  comprausa-api  → infrastructure/docker/api.Dockerfile, health /health
#   plugin   postgresql
#   worker   reservado (BullMQ); no existe todavía
#   redis    opcional; la API no lo abre en este corte

[api]
service = "comprausa-api"
dockerfile = "infrastructure/docker/api.Dockerfile"
healthcheck_path = "/health"
iac = ".railway/railway.ts"

[postgres]
plugin = "postgresql"

[worker]
service = "comprausa-worker"
note = "No existe todavía. Reservado para BullMQ cuando haya jobs reales."

[redis]
plugin = "redis"
required_for_skeleton = false
